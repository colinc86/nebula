[package]
name = "nebula"
version = "0.2.0"
edition = "2021"
description = "LLM-friendly programming language — maximum code density, universal translatability"

[[bin]]
name = "nebula"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-swift = "0.7"
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
ureq = { version = "2", features = ["json"] }
